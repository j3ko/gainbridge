name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

permissions: {}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      # --frozen: release-please's version-bump PRs change backend/pyproject.toml's
      # version, which uv.lock also tracks for the local `app` package. An
      # unfrozen `uv run` silently re-locks to fix that drift as a side effect,
      # which prek/pre-commit then reports as a spurious failure elsewhere
      # (see docs/decisions/0011). Frozen here too so this job never does it.
      - name: Migrate DB
        run: uv run --frozen bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        run: uv run --frozen bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - name: Store coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        run: uv run --frozen coverage report --fail-under=90
        working-directory: backend
