name: Labels
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      # For label-checker
      - labeled
      - unlabeled

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@v7
      if: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    - run: echo "Done adding labels"
  # Labels human PRs by their Conventional Commits title prefix. Each
  # recognized type keeps its own label rather than folding into a shared
  # bucket - only feat/fix/docs/perf are renamed (to match existing/clearer
  # label names), everything else uses its literal type as the label.
  # Skipped for dependabot, which already gets its labels straight from
  # dependabot.yml and doesn't use conventional titles. Keyed off the PR's
  # own branch, not the actor of the triggering push - a human pushing a
  # follow-up fixup commit to a dependabot/* branch (actor != dependabot[bot])
  # must still skip this, since the PR's title itself is still dependabot's
  # non-conventional one. Getting this wrong previously kept the PR's
  # mergeable_state at "unstable" indefinitely, which blocked Dependabot's
  # own auto-close-when-superseded logic even for an otherwise-empty diff.
  pr-title-labeler:
    if: ${{ !startsWith(github.head_ref, 'dependabot/') && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: ytanikin/PRConventionalCommits@b628c5a234cc32513014b7bfdd1e47b532124d98 # 1.3.0
        with:
          task_types: '["feat","fix","docs","style","refactor","perf","test","build","ci","chore","revert"]'
          custom_labels: '{"feat": "feature", "fix": "bug", "docs": "documentation", "perf": "performance"}'
  # Run this after labeler/pr-title-labeler applied labels. pr-title-labeler
  # is deliberately skipped for dependabot and for labeled/unlabeled events -
  # a skipped needs job makes a job skip too by default, so without this
  # override check-labels would never run at all for dependabot PRs.
  check-labels:
    needs:
      - labeler
      - pr-title-labeler
    if: ${{ !cancelled() }}
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: docker://agilepathway/pull-request-label-checker:latest
        with:
          any_of: breaking change,feature,bug,documentation,performance,style,refactor,test,build,ci,chore,revert,internal
          repo_token: ${{ secrets.GITHUB_TOKEN }}
